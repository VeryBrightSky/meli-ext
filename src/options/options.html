<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opciones</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <img id="brand-logo" alt="" width="24" height="24" />
        <h1 id="brand-name"></h1>
      </header>

      <label class="setting">
        <input type="checkbox" id="card-enabled" />
        <span id="lbl-card"></span>
      </label>

      <label class="setting">
        <input type="checkbox" id="strips-enabled" />
        <span id="lbl-strips"></span>
      </label>

      <label class="setting setting--field">
        <span id="lbl-shipping"></span>
        <input type="text" inputmode="decimal" id="default-shipping" placeholder="0.00" />
      </label>

      <label class="setting setting--field">
        <span id="lbl-type"></span>
        <select id="default-type">
          <option value="auto" id="opt-auto"></option>
          <option value="classic">Clásica</option>
          <option value="premium">Premium</option>
        </select>
      </label>

      <label class="setting setting--field">
        <span id="lbl-acquisition"></span>
        <input type="text" inputmode="decimal" id="acquisition-pct" placeholder="0" />
      </label>

      <div class="subscription">
        <h2 id="lbl-subscription"></h2>
        <p class="status" id="sub-status">…</p>
        <p class="status status--metrics" id="metrics"></p>
        <div class="sub-actions">
          <button type="button" id="manage-btn"></button>
          <button type="button" id="login-btn"></button>
          <button type="button" id="dashboard-btn"></button>
        </div>
      </div>

      <div class="reset">
        <button type="button" id="reset-btn"></button>
        <p class="hint" id="reset-hint"></p>
        <p class="hint hint--ok" id="reset-status" hidden></p>
      </div>
    </main>

    <script src="../config/branding.js"></script>
    <script src="../config/locale-data.js"></script>
    <script src="../config/i18n.js"></script>
    <script src="../fees/calculator.js"></script>
    <script src="../pro/gate.js"></script>
    <script src="options.js"></script>
  </body>
</html>
