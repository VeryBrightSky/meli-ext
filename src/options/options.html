<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opciones</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <img id="brand-logo" alt="" width="24" height="24" />
        <h1 id="brand-name"></h1>
      </header>

      <label class="setting">
        <input type="checkbox" id="enabled" />
        <span>Mostrar tarjetas en MercadoLibre</span>
      </label>

      <p class="hint">
        Más opciones llegarán en próximas versiones (idioma, costos por
        defecto, envíos).
      </p>
    </main>

    <script src="../config/branding.js"></script>
    <script src="options.js"></script>
  </body>
</html>
