<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netio</title>
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <img id="brand-logo" alt="" width="40" height="40" />
        <span class="wm">net<b>io</b></span>
        <span class="pill" id="pill"></span>
      </header>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <ol class="steps">
        <li><b id="s1t"></b><span id="s1b"></span></li>
        <li><b id="s2t"></b><span id="s2b"></span></li>
        <li><b id="s3t"></b><span id="s3b"></span></li>
      </ol>
      <div class="actions">
        <a class="btn btn-primary" id="go" href="https://www.mercadolibre.com.mx/" target="_blank" rel="noopener"></a>
        <button type="button" class="btn btn-ghost" id="dash"></button>
        <a class="btn btn-ghost" id="share" href="#" target="_blank" rel="noopener"></a>
      </div>
      <p class="note" id="note"></p>
      <div class="tnotice" id="tnotice" hidden>
        <span id="tnotice-text"></span>
        <a id="tnotice-link" href="#" target="_blank" rel="noopener"></a>
        <button type="button" class="btn btn-ghost btn-sm" id="tnotice-off"></button>
      </div>
    </main>
    <script src="../config/branding.js"></script>
    <script src="../config/locale-data.js"></script>
    <script src="../config/i18n.js"></script>
    <script src="../telemetry/telemetry-client.js"></script>
    <script src="../pro/gate.js"></script>
    <script src="../pro/live-reload.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
