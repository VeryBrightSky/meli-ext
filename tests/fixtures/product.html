<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <title>Celular Test Pro 128 GB | MercadoLibre</title>
  <!-- price via microdata, like real PDPs -->
  <meta itemprop="price" content="827" />
</head>
<body>
  <div id="root-app">
    <!-- Breadcrumb deliberately machine-translated to English: detection must
         come from the embedded structured data, not visible text. -->
    <nav class="andes-breadcrumb">
      <a class="andes-breadcrumb__link" href="#">Cell Phones and Telephones</a>
      <a class="andes-breadcrumb__link" href="#">Smartphones</a>
    </nav>
    <main>
      <div class="ui-pdp-container">
        <div class="ui-pdp-container__col--col-right">
          <!-- hidden duplicate price block (sticky-header clone regression) -->
          <div class="ui-pdp-price" style="display:none">
            <span class="andes-money-amount">
              <span class="andes-money-amount__fraction">1,199</span>
            </span>
          </div>
          <!-- visible price block with a crossed-out previous price -->
          <div class="ui-pdp-price">
            <s class="andes-money-amount andes-money-amount--previous">
              <span class="andes-money-amount__fraction">1,199</span>
            </s>
            <span class="andes-money-amount">
              <span class="andes-money-amount__fraction">827</span><span class="andes-money-amount__cents">00</span>
            </span>
          </div>
          <button type="button">Comprar ahora</button>
          <div class="ui-pdp-payment">Medios de pago</div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Preloaded-state style category data (script content is never machine
    // translated). Padding keeps it over the extractor's min-length filter.
    window.__PRELOADED_STATE__ = {
      "pageState": {
        "category_id": "MLM1055",
        "path_from_root": [
          { "id": "MLM1051", "name": "Celulares y Teléfonos" },
          { "id": "MLM1055", "name": "Celulares y Smartphones" }
        ],
        "padding": "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      }
    };
  </script>
</body>
</html>
